<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ажлын төлөвлөгөө ба Санхүү Дашборд</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 p-4 md:p-6">

  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Ажлын төлөвлөгөө & Санхүү Дашборд</h1>

    <!-- Картнуудын хэсэг -->
    <div id="cards-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6"></div>

    <!-- Үндсэн агуулга -->
    <div id="main-content"></div>
  </div>

  <script>
    const defaultData = {
      day: [], week: [], month: [], courses: [],
      habits: [], // { name: '', days: [false,...31] }
      financeTransactions: [] // { date: '', type: '', desc: '', amount: 0 }
    };

    const categories = [
      { id: 'day', name: 'Өдөр', icon: '📅' },
      { id: 'week', name: '7 хоног', icon: '🗓️' },
      { id: 'month', name: 'Сар', icon: '📊' },
      { id: 'habits', name: '31 Хоног Дадал', icon: '✨' },
      { id: 'finance', name: 'Санхүү', icon: '💰' },
      { id: 'courses', name: 'Курс', icon: '🎓' }
    ];

    let currentCategory = 'day';
    let plannerData = JSON.parse(localStorage.getItem('plannerData')) || defaultData;
    if(!plannerData.financeTransactions) plannerData.financeTransactions = [];
    if(!plannerData.habits) plannerData.habits = [];

    function saveData() {
      localStorage.setItem('plannerData', JSON.stringify(plannerData));
      render();
    }

    function selectCategory(id) {
      currentCategory = id;
      render();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = categories.map(cat => `
        <div onclick="selectCategory('${cat.id}')" class="cursor-pointer p-4 rounded-xl border ${currentCategory === cat.id ? 'bg-amber-100 border-amber-500' : 'bg-white border-gray-200'} shadow-sm text-center">
          <div class="text-2xl">${cat.icon}</div>
          <div class="font-bold text-sm text-gray-700 mt-1">${cat.name}</div>
        </div>
      `).join('');
    }

    // --- 1. АЖИЛ БҮРТГЭЛ & ЗЭРЭГЛЭЛ ---
    function addItem() {
      const input = document.getElementById('task-input');
      const priority = document.getElementById('task-priority').value;
      const text = input.value.trim();
      if (text) {
        if (!plannerData[currentCategory]) plannerData[currentCategory] = [];
        plannerData[currentCategory].push({ text, priority, completed: false });
        input.value = '';
        saveData();
      }
    }

    function toggleItem(index) {
      plannerData[currentCategory][index].completed = !plannerData[currentCategory][index].completed;
      saveData();
    }

    function deleteItem(index) {
      plannerData[currentCategory].splice(index, 1);
      saveData();
    }

    function renderTaskView() {
      const items = plannerData[currentCategory] || [];
      const total = items.length;
      const completed = items.filter(i => i.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);
      const catObj = categories.find(c => c.id === currentCategory);

      const priorityBadge = (p) => {
        if (p === 'high') return `<span class="bg-red-100 text-red-700 text-xs px-2 py-1 rounded font-bold">🔴 Нэн чухал</span>`;
        if (p === 'medium') return `<span class="bg-yellow-100 text-yellow-800 text-xs px-2 py-1 rounded font-bold">🟡 Чухал</span>`;
        return `<span class="bg-green-100 text-green-700 text-xs px-2 py-1 rounded font-bold">🟢 Чухал биш</span>`;
      };

      return `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 flex items-center gap-6">
          <div class="w-20 h-20 rounded-full border-4 border-amber-500 flex items-center justify-center font-bold text-lg text-amber-600 shrink-0">
            ${percent}%
          </div>
          <div>
            <h2 class="text-xl font-bold text-gray-800">${catObj.name}</h2>
            <p class="text-sm text-gray-500">${completed}/${total} ажил дууссан</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-wrap gap-2">
          <input type="text" id="task-input" placeholder="Шинэ ажил нэмэх..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-amber-500">
          <select id="task-priority" class="px-3 py-2 border rounded-lg bg-gray-50 text-sm">
            <option value="high">🔴 Нэн чухал</option>
            <option value="medium" selected>🟡 Чухал</option>
            <option value="low">🟢 Чухал биш</option>
          </select>
          <button onclick="addItem()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2 rounded-lg transition">Нэмэх</button>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <ul class="space-y-3">
            ${items.length === 0 ? '<li class="text-gray-400 text-center py-4">Одоогоор ажил бүртгэгдээгүй байна.</li>' : ''}
            ${items.map((item, index) => `
              <li class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div class="flex items-center gap-3">
                  <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleItem(${index})" class="w-5 h-5 accent-amber-500 cursor-pointer">
                  <span class="${item.completed ? 'line-through text-gray-400' : 'text-gray-800 font-medium'}">${item.text}</span>
                  ${priorityBadge(item.priority)}
                </div>
                <button onclick="deleteItem(${index})" class="text-red-500 font-bold px-2">✕</button>
              </li>
            `).join('')}
          </ul>
        </div>
      `;
    }

    // --- 2. 31 ХОНОГИЙН ДАДАЛ ЧЕЛЛЕНЖ ---
    function addHabit() {
      const input = document.getElementById('habit-input');
      const text = input.value.trim();
      if(text) {
        plannerData.habits.push({ name: text, days: Array(31).fill(false) });
        input.value = '';
        saveData();
      }
    }

    function toggleHabitDay(hIndex, dIndex) {
      plannerData.habits[hIndex].days[dIndex] = !plannerData.habits[hIndex].days[dIndex];
      saveData();
    }

    function deleteHabit(hIndex) {
      plannerData.habits.splice(hIndex, 1);
      saveData();
    }

    function renderHabitView() {
      return `
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex gap-2">
          <input type="text" id="habit-input" placeholder="Шинэ дадал нэмэх (Жишээ нь: Ном унших)..." class="flex-1 px-4 py-2 border rounded-lg">
          <button onclick="addHabit()" class="bg-amber-500 text-white font-bold px-6 py-2 rounded-lg">Нэмэх</button>
        </div>

        <div class="space-y-6">
          ${plannerData.habits.map((habit, hIdx) => `
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
              <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-gray-800">✨ ${habit.name}</h3>
                <button onclick="deleteHabit(${hIdx})" class="text-red-500 text-sm font-bold">Устгах ✕</button>
              </div>
              <div class="grid grid-cols-7 sm:grid-cols-11 md:grid-cols-16 gap-2 text-center">
                ${habit.days.map((checked, dIdx) => `
                  <div onclick="toggleHabitDay(${hIdx}, ${dIdx})" class="cursor-pointer border rounded p-1 text-xs ${checked ? 'bg-amber-500 text-white border-amber-500 font-bold' : 'bg-gray-50 border-gray-200'}">
                    ${dIdx + 1}<br>${checked ? '✓' : ''}
                  </div>
                `).join('')}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // --- 3. САНХҮҮГИЙН ДЭЛГЭРЭНГҮЙ БҮРТГЭЛ ---
    function addTransaction() {
      const date = document.getElementById('fin-date').value;
      const type = document.getElementById('fin-type').value;
      const desc = document.getElementById('fin-desc').value.trim();
      const amount = Number(document.getElementById('fin-amount').value);

      if(date && desc && amount > 0) {
        plannerData.financeTransactions.push({ date, type, desc, amount });
        saveData();
      }
    }

    function deleteTransaction(index) {
      plannerData.financeTransactions.splice(index, 1);
      saveData();
    }

    function renderFinanceView() {
      const txs = plannerData.financeTransactions;
      let inc = 0, exp = 0, sav = 0, dbt = 0;

      txs.forEach(t => {
        if(t.type === 'income') inc += t.amount;
        if(t.type === 'expense') exp += t.amount;
        if(t.type === 'savings') sav += t.amount;
        if(t.type === 'debt') dbt += t.amount;
      });

      const balance = inc - exp;
      let summary = "";
      if (txs.length === 0) summary = "Гүйлгээний мэдээллээ оруулж эхэлнэ үү.";
      else if (balance < 0) summary = "⚠️ Алдагдалтай байна! Зарлага чинь орлогоосоо давсан байна.";
      else if (dbt > sav) summary = "💡 Анхаар: Өр зээлийн хэмжээ хадгаламжаас их байна.";
      else summary = "🎉 Санхүүгийн сайн баланстай байна! Хадгаламжаа улам нэмэгдүүлээрэй.";

      return `
        <!-- Нийт дүнгийн самбар -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-white p-4 rounded-xl border border-gray-200 text-center"><div class="text-xs text-gray-500">Орлого</div><div class="text-xl font-bold text-green-600">₮${inc.toLocaleString()}</div></div>
          <div class="bg-white p-4 rounded-xl border border-gray-200 text-center"><div class="text-xs text-gray-500">Зарлага</div><div class="text-xl font-bold text-red-500">₮${exp.toLocaleString()}</div></div>
          <div class="bg-white p-4 rounded-xl border border-gray-200 text-center"><div class="text-xs text-gray-500">Хадгаламж</div><div class="text-xl font-bold text-blue-500">₮${sav.toLocaleString()}</div></div>
          <div class="bg-white p-4 rounded-xl border border-gray-200 text-center"><div class="text-xs text-gray-500">Өр зээл</div><div class="text-xl font-bold text-amber-500">₮${dbt.toLocaleString()}</div></div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
          <!-- Гүйлгээ нэмэх Форм -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 space-y-3">
            <h2 class="font-bold text-gray-800 border-b pb-2">➕ Шинэ гүйлгээ бүртгэх</h2>
            <input type="date" id="fin-date" value="${new Date().toISOString().split('T')[0]}" class="w-full p-2 border rounded-lg">
            <select id="fin-type" class="w-full p-2 border rounded-lg">
              <option value="income">Орлого (+)</option>
              <option value="expense">Зарлага (-)</option>
              <option value="savings">Хадгаламж (💾)</option>
              <option value="debt">Өр зээл (💳)</option>
            </select>
            <input type="text" id="fin-desc" placeholder="Хаанаас / Юунд (Тайлбар)..." class="w-full p-2 border rounded-lg">
            <input type="number" id="fin-amount" placeholder="Дүн (₮)..." class="w-full p-2 border rounded-lg">
            <button onclick="addTransaction()" class="w-full bg-amber-500 text-white font-bold py-2 rounded-lg">Бүртгэх</button>
          </div>

          <!-- График болон Дүгнэлт -->
          <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col justify-between">
            <div>
              <h2 class="font-bold text-gray-800 border-b pb-2 mb-4">📊 Санхүүгийн Харьцуулалт</h2>
              <div class="w-full max-w-xs mx-auto"><canvas id="financeChart"></canvas></div>
            </div>
            <div class="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-lg text-sm text-amber-900 font-medium">
              ${summary}
            </div>
          </div>
        </div>

        <!-- Гүйлгээний жагсаалт -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
          <h2 class="font-bold text-gray-800 border-b pb-3 mb-4">📜 Гүйлгээний түүх</h2>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b bg-gray-50">
                  <th class="p-2">Огноо</th>
                  <th class="p-2">Төрөл</th>
                  <th class="p-2">Тайлбар</th>
                  <th class="p-2">Дүн</th>
                  <th class="p-2"></th>
                </tr>
              </thead>
              <tbody>
                ${txs.length === 0 ? '<tr><td colspan="5" class="text-center py-4 text-gray-400">Одоогоор гүйлгээ бүртгэгдээгүй байна.</td></tr>' : ''}
                ${txs.map((t, i) => `
                  <tr class="border-b">
                    <td class="p-2">${t.date}</td>
                    <td class="p-2 font-bold ${t.type === 'income' ? 'text-green-600' : t.type === 'expense' ? 'text-red-500' : 'text-blue-500'}">
                      ${t.type === 'income' ? 'Орлого' : t.type === 'expense' ? 'Зарлага' : t.type === 'savings' ? 'Хадгаламж' : 'Өр зээл'}
                    </td>
                    <td class="p-2">${t.desc}</td>
                    <td class="p-2 font-bold">₮${t.amount.toLocaleString()}</td>
                    <td class="p-2"><button onclick="deleteTransaction(${i})" class="text-red-500 font-bold">✕</button></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function initChart() {
      const ctx = document.getElementById('financeChart');
      if (!ctx) return;
      const txs = plannerData.financeTransactions;
      let inc = 0, exp = 0, sav = 0, dbt = 0;
      txs.forEach(t => {
        if(t.type === 'income') inc += t.amount;
        if(t.type === 'expense') exp += t.amount;
        if(t.type === 'savings') sav += t.amount;
        if(t.type === 'debt') dbt += t.amount;
      });

      new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Орлого', 'Зарлага', 'Хадгаламж', 'Өр зээл'],
          datasets: [{
            data: [inc, exp, sav, dbt],
            backgroundColor: ['#10B981', '#EF4444', '#3B82F6', '#F59E0B']
          }]
        },
        options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
      });
    }

    function render() {
      renderCards();
      const main = document.getElementById('main-content');
      if (currentCategory === 'finance') {
        main.innerHTML = renderFinanceView();
        initChart();
      } else if (currentCategory === 'habits') {
        main.innerHTML = renderHabitView();
      } else {
        main.innerHTML = renderTaskView();
      }
    }

    document.addEventListener('DOMContentLoaded', render);
    render();
  </script>
</body>
</html>
