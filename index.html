<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ажлын төлөвлөгөө дашборд</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800 p-4 md:p-6">

  <div class="max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">Ажлын төлөвлөгөө дашборд</h1>

    <!-- Картнуудын хэсэг -->
    <div id="cards-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6"></div>

    <!-- Сонгосон ангиллын тойм -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 mb-6 flex items-center gap-6">
      <div id="progress-circle" class="w-20 h-20 rounded-full border-4 border-amber-500 flex items-center justify-center font-bold text-lg text-amber-600 shrink-0">
        0%
      </div>
      <div>
        <h2 id="current-category-title" class="text-xl font-bold text-gray-800">Өдөр</h2>
        <p id="current-category-status" class="text-sm text-gray-500">0/0 ажил дууссан</p>
      </div>
    </div>

    <!-- Шинэ ажил нэмэх хэсэг -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex gap-2">
      <input type="text" id="task-input" placeholder="Шинэ ажил нэмэх..." class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-amber-500">
      <button onclick="addItem()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-6 py-2 rounded-lg transition">Нэмэх</button>
    </div>

    <!-- Ажлын жагсаалт -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
      <ul id="task-list" class="space-y-3"></ul>
    </div>
  </div>

  <script>
    const defaultData = { day: [], week: [], month: [], habits: [], finance: [], courses: [] };
    const categories = [
      { id: 'day', name: 'Өдөр', icon: '📅' },
      { id: 'week', name: '7 хоног', icon: '🗓️' },
      { id: 'month', name: 'Сар', icon: '📊' },
      { id: 'habits', name: 'Дадал', icon: '✨' },
      { id: 'finance', name: 'Санхүү', icon: '💰' },
      { id: 'courses', name: 'Онлайн курс', icon: '🎓' }
    ];

    let currentCategory = 'day';
    let plannerData = JSON.parse(localStorage.getItem('plannerData')) || defaultData;

    function saveData() {
      localStorage.setItem('plannerData', JSON.stringify(plannerData));
      render();
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = categories.map(cat => `
        <div onclick="selectCategory('${cat.id}')" class="cursor-pointer p-4 rounded-xl border ${currentCategory === cat.id ? 'bg-amber-100 border-amber-500' : 'bg-white border-gray-200'} shadow-sm text-center">
          <div class="text-2xl">${cat.icon}</div>
          <div class="font-bold text-sm text-gray-700 mt-1">${cat.name}</div>
        </div>
      `).join('');
    }

    function selectCategory(id) {
      currentCategory = id;
      render();
    }

    function addItem() {
      const input = document.getElementById('task-input');
      const text = input.value.trim();
      if (text) {
        if (!plannerData[currentCategory]) plannerData[currentCategory] = [];
        plannerData[currentCategory].push({ text, completed: false });
        input.value = '';
        saveData();
      }
    }

    function toggleItem(index) {
      plannerData[currentCategory][index].completed = !plannerData[currentCategory][index].completed;
      saveData();
    }

    function deleteItem(index) {
      plannerData[currentCategory].splice(index, 1);
      saveData();
    }

    function renderTaskList() {
      const list = document.getElementById('task-list');
      const items = plannerData[currentCategory] || [];
      if (items.length === 0) {
        list.innerHTML = `<li class="text-gray-400 text-center py-4">Одоогоор ажил бүртгэгдээгүй байна.</li>`;
        return;
      }
      list.innerHTML = items.map((item, index) => `
        <li class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-200">
          <span onclick="toggleItem(${index})" class="cursor-pointer ${item.completed ? 'line-through text-gray-400' : 'text-gray-800'}">
            ${item.completed ? '✅' : '⚪'} ${item.text}
          </span>
          <button onclick="deleteItem(${index})" class="text-red-500 font-bold px-2">✕</button>
        </li>
      `).join('');
    }

    function renderProgress() {
      const items = plannerData[currentCategory] || [];
      const total = items.length;
      const completed = items.filter(i => i.completed).length;
      const percent = total === 0 ? 0 : Math.round((completed / total) * 100);

      const catObj = categories.find(c => c.id === currentCategory);
      document.getElementById('current-category-title').innerText = catObj ? catObj.name : '';
      document.getElementById('current-category-status').innerText = `${completed}/${total} ажил дууссан`;
      document.getElementById('progress-circle').innerText = `${percent}%`;
    }

    function render() {
      renderCards();
      renderTaskList();
      renderProgress();
    }

    document.addEventListener('DOMContentLoaded', render);
    render();
  </script>
</body>
</html>
