<span id="user-pkg-badge" class="user-badge"></span>
        <button onclick="logout()" style="margin-left: 8px; padding: 4px 8px; border: 1px solid #cbd5e0; background: #fff; border-radius: 4px; cursor: pointer; font-size: 11px;">Гарах</button>
      </div>
    </div>

    <!-- Навигацийн Таб-ууд -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('tasks')">📅 Өдрийн төлөвлөгөө</button>
      <button class="tab-btn" onclick="switchTab('finance')">💰 Санхүү</button>
      <button class="tab-btn" onclick="switchTab('habits')">🔄 Дадал хэвшил</button>
      <button class="tab-btn" onclick="switchTab('vision')">🎯 Зорилго / VIP</button>
    </div>

    <!-- 1. ӨДРИЙН ТӨЛӨВЛӨГӨӨ -->
    <div id="tab-tasks" class="tab-content">
      <div class="card">
        <h3>Өнөөдрийн ажил нэмэх</h3>
        <div class="input-row">
          <input type="text" id="task-title" placeholder="Ажлын нэр..." />
          <select id="task-priority">
            <option value="normal">Энгийн</option>
            <option value="important">Чухал</option>
            <option value="urgent">Яаралтай</option>
          </select>
          <button class="btn-add" onclick="addTask()">Нэмэх</button>
        </div>
        <div>
          <span>Гүйцэтгэл:</span>
          <div class="progress-container">
            <div id="task-progress-bar" class="progress-bar">0%</div>
          </div>
        </div>
      </div>
      <div class="card">
        <h3>Миний жагсаалт</h3>
        <div id="task-list"></div>
      </div>
    </div>

    <!-- 2. САНХҮҮ -->
    <div id="tab-finance" class="tab-content" style="display: none;">
      <div class="card">
        <h3>Санхүүгийн тойм</h3>
        <div class="fin-summary">
          <div class="fin-card fc-inc">Ологоо: <span id="fin-total-inc">0₮</span></div>
          <div class="fin-card fc-exp">Зарлага: <span id="fin-total-exp">0₮</span></div>
          <div class="fin-card fc-sav">Хэмнэлт: <span id="fin-total-sav">0₮</span></div>
        </div>
      </div>
      <div class="card">
        <h3>Гүйлгээ бүртгэх</h3>
        <div class="input-row">
          <select id="fin-type">
            <option value="income">Орлого</option>
            <option value="expense">Зарлага</option>
          </select>
          <input type="text" id="fin-desc" placeholder="Гүйлгээний утга..." />
          <input type="number" id="fin-amount" placeholder="Дүн (₮)" />
          <button class="btn-add" onclick="addFinance()">Бүртгэх</button>
        </div>
      </div>
      <div class="card">
        <h3>Сүүлийн гүйлгээ</h3>
        <div id="fin-list"></div>
      </div>
    </div>

    <!-- 3. ДАДАЛ ХЭВШИЛ -->
    <div id="tab-habits" class="tab-content" style="display: none;">
      <div class="card">
        <h3>Шинэ дадал нэмэх</h3>
        <div class="input-row">
          <input type="text" id="habit-name" placeholder="Жишээ: 1.5л ус уух..." />
          <button class="btn-add" onclick="addHabit()">Дадал нэмэх</button>
        </div>
      </div>
      <div id="habit-container"></div>
    </div>

    <!-- 4. ЗОРИЛГО / VIP -->
    <div id="tab-vision" class="tab-content" style="display: none;">
      <div id="vip-content-wrapper">
        <!-- VIP биш бол түгжигдэнэ -->
      </div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Firebase тохиргоо (Өөрийн төслийн мэдээллээр солих шаардлагатай)
    const firebaseConfig = {
      databaseURL: "https://YOUR_DATABASE_NAME.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentUser = null; // { phone, name, package }

    // Цаг хугацаа шинэчлэх
    setInterval(() => {
      const now = new Date();
      document.getElementById('live-date').innerText = now.toISOString().split('T')[0];
      document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
    }, 1000);

    // Нэвтрэх хэсэг
    function handleLogin() {
      const phone = document.getElementById('login-phone').value.trim();
      if (!phone) return;

      // Firebase-с хэрэглэгчийг шалгах
      db.ref('users/' + phone).once('value').then(snapshot => {
        const userData = snapshot.val();
        if (userData) {
          currentUser = { phone, ...userData };
          localStorage.setItem('planner_phone', phone);
          initApp();
        } else {
          // Хэрэв бүртгэлгүй бол демо байдлаар шууд үүсгэх эсвэл алдаа гаргах
          document.getElementById('login-error').style.display = 'block';
        }
      });
    }

    // Автоматаар өмнө нь орсон эсэхийг шалгах
    window.onload = function() {
      const savedPhone = localStorage.getItem('planner_phone');
      if (savedPhone) {
        db.ref('users/' + savedPhone).once('value').then(snapshot => {
          if (snapshot.val()) {
            currentUser = { phone: savedPhone, ...snapshot.val() };
            initApp();
          }
        });
      }
    };

    function initApp() {
      document.getElementById('login-overlay').style.display = 'none';
      document.getElementById('user-display-name').innerText = currentUser.name || 'Хэрэглэгч';
      document.getElementById('user-display-phone').innerText = currentUser.phone;
      
      const badge = document.getElementById('user-pkg-badge');
      const pkg = currentUser.package || 'BASIC';
      badge.innerText = pkg;
      badge.className = 'user-badge badge-' + pkg;

      loadTasks();
      loadFinance();
      loadHabits();
      setupVisionTab();
    }

    function logout() {
      localStorage.removeItem('planner_phone');
      location.reload();
    }

    // Таб шилжүүлэгч
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById('tab-' + tabName).style.display = 'block';
      event.currentTarget.classList.add('active');
    }

    // 1. ТӨЛӨВЛӨГӨӨНИЙ ФУНКЦҮҮД
    function addTask() {
      const title = document.getElementById('task-title').value.trim();
      const priority = document.getElementById('task-priority').value;
      if (!title) return;

      const taskRef = db.ref(`tasks/${currentUser.phone}`).push();
      taskRef.set({ title, priority, completed: false }, () => {
        document.getElementById('task-title').value = '';
        loadTasks();
      });
    }

    function loadTasks() {
      db.ref(`tasks/${currentUser.phone}`).on('value', snapshot => {
        const list = document.getElementById('task-list');
        list.innerHTML = '';
        let total = 0, completedCount = 0;

        snapshot.forEach(child => {
          total++;
          const val = child.val();
          if (val.completed) completedCount++;

          const pClass = val.priority === 'urgent' ? 'p-urgent' : (val.priority === 'important' ? 'p-important' : '');
          
          list.innerHTML += `
            <div class="task-item ${val.completed ? 'completed' : ''}">
              <div style="display: flex; align-items: center;">
                <input type="checkbox" ${val.completed ? 'checked' : ''} onchange="toggleTask('${child.key}', ${!val.completed})" style="margin-right: 10px;" />
                <span class="task-title">${val.title}</span>
                ${pClass ? `<span class="priority-badge ${pClass}">${val.priority}</span>` : ''}
              </div>
              <button class="btn-del" onclick="deleteTask('${child.key}')">×</button>
            </div>
          `;
        });

        const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
        const bar = document.getElementById('task-progress-bar');
        bar.style.width = percent + '%';
        bar.innerText = percent + '%';
      });
    }

    function toggleTask(id, status) {
      db.ref(`tasks/${currentUser.phone}/${id}`).update({ completed: status });
    }

    function deleteTask(id) {
      db.ref(`tasks/${currentUser.phone}/${id}`).remove();
    }

    // 2. САНХҮҮГИЙН ФУНКЦҮҮД
    function addFinance() {
      const type = document.getElementById('fin-type').value;
      const desc = document.getElementById('fin-desc').value.trim();
      const amount = parseFloat(document.getElementById('fin-amount').value);
      if (!desc || isNaN(amount)) return;

      db.ref(`finance/${currentUser.phone}`).push({ type, desc, amount, date: new Date().toLocaleDateString() }, () => {
        document.getElementById('fin-desc').value = '';
        document.getElementById('fin-amount').value = '';
        loadFinance();
      });
    }

    function loadFinance() {
      db.ref(`finance/${currentUser.phone}`).on('value', snapshot => {
        const list = document.getElementById('fin-list');
        list.innerHTML = '';
        let totalInc = 0, totalExp = 0;

        snapshot.forEach(child => {
          const val = child.val();
          if (val.type === 'income') totalInc += val.amount;
          else totalExp += val.amount;

          list.innerHTML += `
            <div style="display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 13px;">
              <span>${val.date} - ${val.desc}</span>
              <span style="color: ${val.type === 'income' ? 'green' : 'red'}; font-weight: bold;">
                ${val.type === 'income' ? '+' : '-'}${val.amount.toLocaleString()}₮
              </span>
            </div>
          `;
        });

        document.getElementById('fin-total-inc').innerText = totalInc.toLocaleString() + '₮';
        document.getElementById('fin-total-exp').innerText = totalExp.toLocaleString() + '₮';
        document.getElementById('fin-total-sav').innerText = (totalInc - totalExp).toLocaleString() + '₮';
      });
    }

    // 3. ДАДАЛ ХЭВШЛИЙН ФУНКЦҮҮД
    function addHabit() {
      const name = document.getElementById('habit-name').value.trim();
      if (!name) return;

      db.ref(`habits/${currentUser.phone}`).push({ name }, () => {
        document.getElementById('habit-name').value = '';
        loadHabits();
      });
    }

    function loadHabits() {
      db.ref(`habits/${currentUser.phone}`).on('value', snapshot => {
        const container = document.getElementById('habit-container');
        container.innerHTML = '';

        snapshot.forEach(child => {
          const val = child.val();
          const habitId = child.key;
          
          let daysHtml = '';
          for (let i = 1; i <= 30; i++) {
            const isDone = val.days && val.days[i];
            daysHtml += `<div class="day-box ${isDone ? 'done' : ''}" onclick="toggleHabitDay('${habitId}', ${i}, ${!isDone})">${i}</div>`;
          }

          container.innerHTML += `
            <div class="habit-item">
              <div style="font-weight: bold; font-size: 14px; display: flex; justify-content: space-between;">
                <span>${val.name}</span>
                <button class="btn-del" onclick="deleteHabit('${habitId}')">Устгах</button>
              </div>
              <div class="habit-grid">${daysHtml}</div>
            </div>
          `;
        });
      });
    }

    function toggleHabitDay(habitId, dayNum, status) {
      db.ref(`habits/${currentUser.phone}/${habitId}/days/${dayNum}`).set(status);
    }

    function deleteHabit(habitId) {
      db.ref(`habits/${currentUser.phone}/${habitId}`).remove();
    }

    // 4. VIP ЗОРИЛГЫН ХЭСЭГ (Хандалтын эрх шалгах)
    function setupVisionTab() {
      const wrapper = document.getElementById('vip-content-wrapper');
      if (currentUser.package === 'VIP' || currentUser.package === 'MASTER') {
        wrapper.innerHTML = `
          <div class="card">
            <h3>🎯 2026 оны Стратеги Зорилгууд (VIP Хэсэг)</h3>
            <p>Та энэ хэсэгт өөрийн том зорилго, төлөвлөгөө болон Vision Board мэдээллээ хадгалах боломжтой.</p>
            <textarea style="width:100%; height:120px; padding:10px; border-radius:6px; border:1px solid #cbd5e0;" placeholder="Энд зорилгоо бичнэ үү..."></textarea>
            <button class="btn-add" style="margin-top: 10px;">Хадгалах</button>
          </div>
        `;
      } else {
        wrapper.innerHTML = `
          <div class="card locked-card">
            <div class="lock-overlay">
              <h3>🔒 Түгжигдсэн хэсэг</h3>
              <p>Энэхүү функц нь зөвхөн <b>MASTER</b> болон <b>VIP</b> эрхтэй хэрэглэгчдэд нээлттэй.</p>
              <a href="#" class="upgrade-btn">Эрхээ ахиулах</a>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
